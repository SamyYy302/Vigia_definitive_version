<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGIA - Autores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #120419;
            --accent-color: #FC75FF;
            --card-bg: rgba(252, 117, 255, 0.03);
            --card-border: rgba(252, 117, 255, 0.15);
            --text-muted: #c89beb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(252, 117, 255, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* BARRA DE NAVEGACIÓN */
        .navbar {
            width: 100%;
            background: rgba(18, 4, 25, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-logo-img {
            width: 45px;
            height: auto;
            filter: drop-shadow(0 2px 8px rgba(252, 117, 255, 0.3));
        }

        .nav-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-color);
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-tab-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-tab-link:hover, .nav-tab-link.active {
            color: var(--accent-color);
        }

        /* MENÚ DESPLEGABLE TIPO NUBE */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 4, 25, 0.95);
            backdrop-filter: blur(16px);
            min-width: 200px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            padding: 10px 0;
            z-index: 200;
            margin-top: 10px;
        }

        .dropdown-content::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background: rgba(18, 4, 25, 0.95);
            border-left: 1px solid var(--card-border);
            border-top: 1px solid var(--card-border);
        }

        .dropdown-content a {
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            display: block;
            font-size: 1rem;
        }

        .dropdown-content a:hover {
            background: rgba(252, 117, 255, 0.15);
            color: var(--accent-color);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* TARJETAS DE AUTOR */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .authors-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 35px;
            width: 100%;
        }

        .author-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        .author-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
        }

        .avatar-frame {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            padding: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .author-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .back-btn {
            margin-top: 50px;
            text-decoration: none;
            color: var(--accent-color);
            border: 1px solid var(--card-border);
            padding: 12px 28px;
            border-radius: 12px;
            background: var(--card-bg);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: #120419;
        }

        @media (max-width: 650px) {
            .authors-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <audio id="catSound" src="gato.mp3" preload="auto"></audio>
    <div class="ambient-glow"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-brand" id="logoBtn">
            <img src="vigia-removebg-preview.png" alt="Logo VIGIA" class="nav-logo-img">
            <span class="nav-title">VIGIA</span>
        </a>
        <ul class="nav-tabs">
            <li><a href="index.html" class="nav-tab-link">Inicio</a></li>
            <li><a href="autores.html" class="nav-tab-link active">Autores</a></li>
            <li><a href="evidencias.html" class="nav-tab-link">Evidencias</a></li>
            
            <li class="dropdown">
                <a href="#" class="nav-tab-link">Más opciones ▾</a>
                <div class="dropdown-content">
                    <a href="lema.html">Lema</a>
                    <a href="logo.html">Logo</a>
                    <a href="texto_proyecto.html">Texto del proyecto</a>
                    <a href="prototipo_real.html">Prototipo real</a>
                    <a href="base_datos.html">Base de datos</a>
                </div>
            </li>

            <li><a href="index.html#contacto" class="nav-tab-link">Contactanos</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header">
            <h1>AUTORES</h1>
            <p>Desarrolladores del proyecto VIGIA</p>
        </div>

        <div class="authors-grid">
            <div class="author-card">
                <div class="avatar-frame">
                    <img src="samuel.jpeg" alt="Samuel Marroquín Vásquez" class="author-img">
                </div>
                <h2 class="author-name">Samuel Marroquín Vásquez</h2>
            </div>

            <div class="author-card">
                <div class="avatar-frame">
                    <img src="joselyn.jpeg" alt="Joselyn Vásquez Betancur" class="author-img">
                </div>
                <h2 class="author-name">Joselyn Vásquez Betancur</h2>
            </div>
        </div>

        <!-- Enlace corregido hacia index.html -->
        <a href="index.html" class="back-btn">← Volver al Inicio</a>
    </div>

    <script>
        const logoBtn = document.getElementById('logoBtn');
        const catSound = document.getElementById('catSound');
        logoBtn.addEventListener('click', () => {
            catSound.currentTime = 0;
            catSound.play().catch(e => console.log(e));
        });
    </script>

</body>
</html>
